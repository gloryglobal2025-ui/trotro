# nginx site config for test2.digitalsecuritymarket.com
# Replace SERVER_USER and the PHP-FPM socket with the values on the host.
# The document root MUST be the Laravel public/ directory, never backend/ itself.

server {
    listen 80;
    listen [::]:80;
    server_name test2.digitalsecuritymarket.com;

    # TLS is terminated by the hosting panel; keep the ACME path reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test2.digitalsecuritymarket.com;

    # Panel-managed certificate paths.
    ssl_certificate     /etc/letsencrypt/live/test2.digitalsecuritymarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test2.digitalsecuritymarket.com/privkey.pem;

    root /home/SERVER_USER/test2.digitalsecuritymarket.com/backend/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 8m;

    access_log /var/log/nginx/test2.digitalsecuritymarket.com.access.log;
    error_log  /var/log/nginx/test2.digitalsecuritymarket.com.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Never expose dotfiles (.env, .git) even though they sit above public/.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
